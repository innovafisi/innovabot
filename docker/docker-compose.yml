# Compose base / desarrollo de InnovaBot.
# - app: FastAPI (API web + webhook Telegram), interno (sin puertos publicados).
# - ollama: light LM local, interno en producción; en desarrollo publica 11434
#   solo en 127.0.0.1 para poder verificar `GET /api/tags` desde el host.
# - ingest: job batch de ingesta, se lanza con `docker compose run ingest`
#   (perfil `ingest`: no arranca con `up`).
# Producción (Caddy + Let's Encrypt) se define en docker-compose.prod.yml (grupo 7).

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file: ../backend/.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      # Máquinas de desarrollo con CPU híbrido (P+E+LPE): sin esto, el
      # auto-detect de Ollama patina (~0.2 tok/s). 6 = P-cores típicos.
      OLLAMA_NUM_THREADS: "6"
    restart: unless-stopped
    depends_on:
      - ollama

  ingest:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file: ../backend/.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_NUM_THREADS: "6"
    command: python -m app.ingest
    profiles:
      - ingest
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    environment:
      # Evita disputa de RAM: una sola generación a la vez (design.md §Modelos).
      OLLAMA_NUM_PARALLEL: "1"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-data:
