[project]
name = "innovabot-backend"
version = "0.1.0"
description = "Backend de InnovaBot: chatbot RAG para consultas sobre la FISI (UNMSM)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "openai>=1.40",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# La ingesta genera embeddings con sentence-transformers (torch ~GBs):
# opcional para que los entornos de desarrollo solo lo instalen si ingieren.
ingest = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
